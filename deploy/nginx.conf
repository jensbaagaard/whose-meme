# nginx site for the droplet.
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/whose-meme
#   sudo ln -s /etc/nginx/sites-available/whose-meme /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d memes.example.com     # HTTPS (recommended)
server {
    listen 80;
    server_name memes.example.com;   # <- your domain (or the droplet IP)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSockets (Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
